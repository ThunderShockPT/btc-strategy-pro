name: BTC Strategy Pro V20 - P1.4 isolated two-account Auth RLS QA
on:
  push:
    branches: [audit/v20-strategy-recovery-20261025]
    paths:
      - '.github/workflows/v20-post34-two-account-rls-qa.yml'
      - 'scripts/test-v20-post34-two-account-rls-20261026.cjs'
      - 'scripts/test-authenticated-api.cjs'
      - 'scripts/helpers/server-fixture.cjs'
      - 'policies/v20-post34-two-account-rls-20261026.json'
  pull_request:
    branches: [qa/v20-block12-recovery-20261022]
    paths:
      - '.github/workflows/v20-post34-two-account-rls-qa.yml'
      - 'scripts/test-v20-post34-two-account-rls-20261026.cjs'
      - 'scripts/test-authenticated-api.cjs'
      - 'scripts/helpers/server-fixture.cjs'
      - 'policies/v20-post34-two-account-rls-20261026.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-two-account-rls-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout isolated QA code
        uses: actions/checkout@v4
      - name: Setup Node with fixed lockfile
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run two-owner PostgreSQL RLS tests on disposable PGlite only
        run: node --test scripts/test-v20-post34-two-account-rls-20261026.cjs
      - name: Run HTTP financial API owner and revoked-session regression on disposable fixtures
        run: node --test scripts/test-authenticated-api.cjs
      - name: Verify financial and public signup gates remain closed
        run: |
          node -e "const p=require('./policies/cloud-release-20261021.json');if(p.financialCloudApproved||p.publicRegistrationApproved||Object.values(p.checks).some(Boolean))process.exit(1);console.log('PASS: production gates remain closed. No Supabase secrets or live connections used.')"
