name: V20 rules data financial engine and risk checks
on:
  push:
    branches: [feat/v20-kraken-rules, feat/v20-data-model, feat/v20-financial-engine, feat/v20-liquidation-risk, feat/v20-dynamic-cash, feat/v20-dynamic-cycles, feat/v20-profiles-exits, feat/v20-strict-profile-policy, feat/v20-auditable-corrections, feat/v20-temporal-simulation, feat/v20-wallet-onboarding, fix/v20-buy-sequence-clarity, feat/v20-app-navigation, feat/v20-trade-journal-ui, feat/v20-persistence-contract, feat/v20-atomic-persistence, feat/v20-authenticated-api, feat/v20-edge-runtime, feat/v20-wallet-plan-persistence, feat/v20-public-financial-context, perf/v20-immutable-rule-reuse, feat/v20-resumable-cycle-search, feat/v20-durable-calculation-jobs, feat/v20-calculation-http, feat/v20-frozen-command-reviews, feat/v20-calculation-plan-review, feat/v20-resumable-profile-plans, feat/v20-runtime-calculation-composition, feat/v20-public-history-orderbook, feat/v20-best-ask-profile-context, perf/v20-public-observation-refresh, perf/v20-large-history-capacity, perf/v20-bounded-risk-paths, qa/v20-block12-recovery-20261022]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Contract rules and regression checks
        run: |
          npm ci --ignore-scripts
          node --check backend/calculation-jobs.cjs
          node --test scripts/test-calculation-jobs.cjs
          node --test scripts/test-calculation-http.cjs
          node --test scripts/test-cloud-calculations.cjs
          node --test scripts/test-account-workflow.cjs
          node --test scripts/test-account-movements.cjs
          node --test scripts/test-account-executions.cjs
          node --test scripts/test-account-wallets.cjs
          node --test scripts/test-account-export.cjs
          node --test scripts/test-account-session.cjs
          node --test scripts/test-hosted-schema-rehearsal.cjs
          node scripts/build-account-host.cjs
          node --test scripts/test-calculation-window.cjs
          node --test scripts/test-calculation-plan-review.cjs
          node --test scripts/test-profile-calculation-review.cjs
          node --test scripts/test-frozen-reviews.cjs
          node --check backend/calculation-checkpoints.cjs
          node --test scripts/test-calculation-checkpoints.cjs
          node --check kraken-rules.js
          node --test scripts/test-rule-reuse.cjs
          node --check legacy-migration.js
          node --check journal-projection.js
          node --check correction-workflow.js
          node --check temporal-simulator.js
          node --check wallet-onboarding.js
          node --check backend/wallet-store.cjs
          node --test scripts/test-wallet-plan-store.cjs
          node --test scripts/test-resumable-risk-paths.cjs
          node --test scripts/test-live-clock-qa.cjs
          node --test scripts/test-real-auth-capacity-fixture.cjs
          node --test scripts/test-large-checkpoint-benchmark.cjs
          node --test scripts/test-kraken-screen-reconciliation.cjs
          node --test scripts/test-public-latency-probe.cjs
          node --test scripts/test-public-profile-context.cjs
          node --check backend/public-observations.cjs
          node --test scripts/test-public-observations.cjs
          node --check backend/public-market.cjs
          node --check backend/financial-context.cjs
          node --test scripts/test-public-financial-context.cjs
          node --check backend/edge-runtime.cjs
          node --check backend/pg-database.cjs
          node --check backend/request-admission.cjs
          node --test scripts/test-edge-runtime.cjs
          node --test scripts/test-runtime-calculations.cjs
          node --test scripts/test-public-runtime-flow.cjs
          node scripts/build-edge-runtime.cjs
          node --test scripts/test-edge-bundle.cjs
          node --test scripts/test-hosted-runtime-qa.cjs
          node --check backend/backup-envelope.cjs
          node --test scripts/test-backup-envelope.cjs
          node --check backend/supabase-auth.cjs
          node --check backend/http-api.cjs
          node --check cloud-client-v20.js
          node --test scripts/test-authenticated-api.cjs
          node --check backend/atomic-store.cjs
          node --test scripts/test-atomic-store.cjs
          node --check backend/persistence-contract.cjs
          node --test scripts/test-persistence-contract.cjs
          node --check execution-workflow.js
          node --check previews/trading-views.js
          node --check previews/onboarding-ui.js
          node --check previews/plan-view.js
          node --check previews/app-views.js
          node --check previews/app-workflows.js
          node --check previews/demo-storage.js
          node --check financial-engine.js
          node --check position-risk.js
          node --check cash-workflow.js
          node --check cycle-planner.js
          node --check risk-profiles.js
          node --check exit-planner.js
          node --test scripts/test-kraken-rules.cjs
          node --test scripts/test-v20-data.cjs
          node --test scripts/test-financial-engine.cjs
          node --test scripts/test-position-risk.cjs
          node --test scripts/test-cash-workflow.cjs
          node --test scripts/test-cycle-planner.cjs
          node --test scripts/test-profiles-exits.cjs
          node --test scripts/test-profile-approval.cjs
          node --test scripts/test-corrections.cjs
          node --test scripts/test-temporal-simulator.cjs
          node --test scripts/test-wallet-onboarding.cjs scripts/test-onboarding-preview.cjs
          node --test scripts/test-plan-view.cjs scripts/test-app-workflows.cjs scripts/test-demo-storage.cjs scripts/test-execution-workflow.cjs
          node scripts/build-onboarding-preview.cjs
          node scripts/test-auth-guard.cjs
          node scripts/test-cloud-sync.cjs
          node scripts/test-public-release.cjs
          node scripts/test-responsive.cjs
          node scripts/test-wallet-planner.cjs

  postgres-atomic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: btcsp_local_qa_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Real PostgreSQL concurrent commands and rollback
        env:
          BTCSP_TEST_PG_URL: postgresql://postgres:btcsp_local_qa_only@127.0.0.1:5432/postgres
          BTCSP_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --test scripts/test-atomic-postgres.cjs
          node --test scripts/test-hosted-schema-rehearsal.cjs

  real-auth-runtime:
    strategy:
      fail-fast: false
      matrix:
        capacity: [baseline, medium-12, large-1, large-12]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: btcsp_disposable_auth_qa
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BTCSP_QA_AUTH_DB_URL: postgresql://postgres:btcsp_disposable_auth_qa@127.0.0.1:55432/postgres
      BTCSP_QA_CAPACITY_CASE: ${{ matrix.capacity }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Prepare disposable loopback Auth database
        run: node scripts/qa/auth-stack/bootstrap.cjs
      - name: Start official Auth service in isolated CI
        run: docker run -d --name btcsp-auth-qa --network host --env-file "$RUNNER_TEMP/btcsp-auth-qa.env" supabase/gotrue:v2.197.0
      - name: Wait for real Auth migrations and health
        run: node scripts/qa/auth-stack/wait.cjs
      - name: Real password sessions and native SQL runtime lifecycle
        run: node --test scripts/test-real-auth-runtime.cjs
      - name: Sanitized Auth startup diagnostics
        if: failure()
        run: node scripts/qa/auth-stack/diagnose.cjs
      - name: Dispose Auth service and temporary configuration
        if: always()
        run: |
          docker rm -f btcsp-auth-qa || true
          rm -f "$RUNNER_TEMP/btcsp-auth-qa.env"

  account-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Use the browser already supplied by the Ubuntu runner
        run: |
          browser_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser_bin"
          "$browser_bin" --version
          printf 'CHROME_BIN=%s\n' "$browser_bin" >> "$GITHUB_ENV"
      - name: Browser session, account review and financial confirmation
        run: node --test scripts/test-account-browser.cjs
