name: Publish BTC Strategy Pro Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify cloud version safety tests
        run: |
          node --check cloud-sync.js
          node scripts/test-cloud-sync.cjs
          node scripts/test-public-release.cjs
          node scripts/test-auth-guard.cjs
          node scripts/test-wallet-planner.cjs
          node --check onboarding.js
          node --check adaptive-viewport.js
          node scripts/test-responsive.cjs
      - name: Browser QA across responsive viewports
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            npx playwright-core@1.56.1 install chromium
          fi
          node scripts/test-mobile-layout.cjs
      - name: Prepare static PWA
        run: |
          python scripts/generate_icons.py
          mkdir -p _site/icons
          cp index.html manifest.webmanifest service-worker.js pwa-controller.js cloud-sync.js auth-guard.js responsive.css adaptive-viewport.js landing.css landing.js wallet-planner.js onboarding.css onboarding.js version.json privacidade.html termos-demo.html _site/
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
