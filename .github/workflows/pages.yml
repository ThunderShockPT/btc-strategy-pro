name: Publish BTC Strategy Pro Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare static PWA
        run: |
          python scripts/generate_icons.py
          mkdir -p _site/icons
          cp index.html manifest.webmanifest service-worker.js pwa-controller.js version.json _site/
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
